# The speech-to-text machine. Run on a server with an NVIDIA card, the NVIDIA driver and the NVIDIA container toolkit:
#   RONBCLIPS_ASR_TOKEN=<the shared secret> docker compose -f deploy/gpu/docker-compose.yml up -d --build
# Then, on the main RONB Tech Clipping server, set RONBCLIPS_ASR_URL=http://<this machine's private address>:9000 and the same
# RONBCLIPS_ASR_TOKEN. Keep port 9000 closed to the internet: only the private network should reach it.
services:
  asr:
    build:
      context: ../..
      dockerfile: deploy/gpu/Dockerfile
    restart: unless-stopped
    environment:
      RONBCLIPS_ASR_TOKEN: ${RONBCLIPS_ASR_TOKEN:?set RONBCLIPS_ASR_TOKEN}
      RONBCLIPS_ASR_HOST: 0.0.0.0 # answer the app on another machine; keep port 9000 on a private network
      RONBCLIPS_ASR_BATCH: ${RONBCLIPS_ASR_BATCH:-16}
      RONBCLIPS_ASR_COPIES: ${RONBCLIPS_ASR_COPIES:-1}
    ports: ["9000:9000"]
    volumes:
      - asrdata:/data
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  asrdata:
