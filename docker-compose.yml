# RONB Tech Clipping on one server: the app, PostgreSQL, and Caddy for HTTPS.
# Copy .env.example to .env, fill it in, then:  docker compose up -d --build
# A server of its own: also set COMPOSE_PROFILES=own-https in .env. A shared server: see deploy/nginx-ronbclips.conf.
services:
  db:
    image: postgres:16-alpine@sha256:f2f98726820d0342055351c6e9d36e705f5bfffb3dd53ff556325114b08afb6d
    mem_limit: ${RONBCLIPS_DB_MEM_LIMIT:-0}
    restart: unless-stopped
    environment:
      POSTGRES_USER: ronbclips
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ronbclips
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ronbclips"]
      interval: 10s
      timeout: 5s
      retries: 6

  app:
    image: ${RONBCLIPS_IMAGE:-ghcr.io/ronbtech/ronb_clips:latest}
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://ronbclips:${POSTGRES_PASSWORD}@db:5432/ronbclips
      RONBCLIPS_PUBLIC_URL: https://${RONBCLIPS_DOMAIN:?set RONBCLIPS_DOMAIN in .env}
    volumes:
      - data:/data
      - ./secrets:/secrets:ro
      - ./.git:/app/.git:ro            # only to tell which version is running, for the update notice
    # Reachable from this server only. On a server that already has a web server, point that one at this port
    # (see deploy/nginx-ronbclips.conf). With the "own-https" profile, Caddy below is the web server instead.
    ports: ["127.0.0.1:${RONBCLIPS_BIND_PORT:-8765}:8765"]
    # On a server shared with other apps, these keep RONB Tech Clipping inside its own share (all unlimited by default):
    # a memory ceiling with no swap, a processor ceiling, a lower turn at the processor when the server is busy,
    # and "stop this one first" if the whole server ever runs out of memory.
    mem_limit: ${RONBCLIPS_MEM_LIMIT:-0}
    memswap_limit: ${RONBCLIPS_MEM_LIMIT:-0}
    cpus: ${RONBCLIPS_CPUS:-0}
    cpu_shares: ${RONBCLIPS_CPU_SHARES:-1024}
    oom_score_adj: ${RONBCLIPS_OOM_SCORE_ADJ:-0}

  # Only on a server RONB Tech Clipping has to itself: add COMPOSE_PROFILES=own-https to .env and Caddy handles HTTPS.
  caddy:
    profiles: ["own-https"]
    image: caddy:2@sha256:4851e54a46b206517c574821bb5cc67f170d2156041e9fbc4c9193b45e84a75b
    restart: unless-stopped
    depends_on: [app]
    ports: ["80:80", "443:443"]
    environment:
      RONBCLIPS_DOMAIN: ${RONBCLIPS_DOMAIN}
    volumes:
      # Caddyfile fetches certificates by itself; Caddyfile.origin uses a Cloudflare origin certificate from ./secrets
      - ./deploy/${RONBCLIPS_CADDYFILE:-Caddyfile}:/etc/caddy/Caddyfile:ro
      - ./secrets:/secrets:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  data:
  caddy_data:
  caddy_config:
