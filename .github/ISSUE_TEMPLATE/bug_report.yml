name: Bug report
description: Report a problem that can be reproduced.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Please remove keys, personal information, and private video details before submitting. For security issues, use the private reporting instructions in SECURITY.md."
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
      description: Tell us what you expected RONB Clips to do.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened?
      description: Include the message or redacted log lines if useful.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: "1. ...\n2. ..."
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: RONB Clips version or commit
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Operating system and install method
      placeholder: "Windows 11, source install / Ubuntu 24.04, Docker"
    validations:
      required: true
