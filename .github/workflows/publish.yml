name: Release and publish container

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Check release version
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          python - "$VERSION" <<'PY'
          import sys
          import tomllib
          from pathlib import Path
          expected = sys.argv[1]
          actual = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))["project"]["version"]
          if actual != expected:
              raise SystemExit(f"Tag v{expected} does not match pyproject.toml version {actual}")
          PY
      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set image tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=preview,enable=${{ startsWith(github.ref_name, 'v0.') }}
            type=raw,value=staging,enable=${{ contains(github.ref_name, '-') }}
            type=raw,value=stable,enable=${{ !startsWith(github.ref_name, 'v0.') && !contains(github.ref_name, '-') }}
            type=raw,value=latest,enable=${{ !startsWith(github.ref_name, 'v0.') && !contains(github.ref_name, '-') }}
      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - name: Verify multi-architecture manifest
        env:
          IMAGE_REPOSITORY: ghcr.io/ronbtech/ronb_clips
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          IMAGE="$IMAGE_REPOSITORY:${RELEASE_TAG#v}"
          docker buildx imagetools inspect "$IMAGE" | tee /tmp/image-manifest.txt
          grep -q 'linux/amd64' /tmp/image-manifest.txt
          grep -q 'linux/arm64' /tmp/image-manifest.txt
      - name: Smoke test ARM64 image under QEMU
        env:
          IMAGE_REPOSITORY: ghcr.io/ronbtech/ronb_clips
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          IMAGE="$IMAGE_REPOSITORY:${RELEASE_TAG#v}"
          docker run --detach --name ronbclips-arm64-smoke --platform linux/arm64 \
            --publish 127.0.0.1:18765:8765 \
            --volume ronbclips-arm64-smoke:/data \
            --env RONBCLIPS_DATA=/data --env RONBCLIPS_FETCH_MODEL=0 "$IMAGE"
          for attempt in $(seq 1 90); do
            if curl --fail --silent http://127.0.0.1:18765/healthz; then exit 0; fi
            if [ "$(docker inspect -f '{{.State.Running}}' ronbclips-arm64-smoke)" != true ]; then
              docker logs ronbclips-arm64-smoke
              exit 1
            fi
            sleep 2
          done
          docker logs ronbclips-arm64-smoke
          exit 1
      - name: Remove ARM64 smoke container
        if: always()
        run: docker rm --force --volumes ronbclips-arm64-smoke || true
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          if [[ "$GITHUB_REF_NAME" == v0.* ]]; then
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes --prerelease
          else
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
          fi
