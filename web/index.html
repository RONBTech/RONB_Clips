<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RONB Clips</title>
<link rel="icon" type="image/svg+xml" href="/brand/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Inter:wght@300&family=Archivo+Black&family=Anton&family=Poppins:wght@800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/index.css">
</head>
<body>
<div class="app" id="app">
  <aside class="side" aria-label="Sidebar">
    <div class="side-head"><img class="logo" src="/brand/logo-tech.png" alt="RONB Clips"><img class="mark" src="/brand/favicon.svg" alt="RONB Clips">
      <button class="icon-btn collapse" data-act="collapse" id="collapseBtn" aria-label="Collapse sidebar"></button></div>
    <nav class="nav" id="nav" aria-label="Main"></nav>
    <div class="side-foot" id="foot"></div>
  </aside>
  <div class="scrim" data-act="menu"></div>
  <main id="main">
    <header class="topbar"><button class="icon-btn menu" data-act="menu" id="menuBtn" aria-label="Open menu"></button>
      <span id="tpic"></span><div class="titles"><h1 id="title"></h1><p id="subtitle"></p></div><nav class="utabs" id="utabs" role="tablist" aria-label="Creator sections"></nav><div class="row" id="actions"></div></header>
    <div id="global-state" role="status" aria-live="polite" aria-atomic="true"></div>
    <div id="vbanner"></div>
    <div id="heroSlot"></div>
    <div class="content" id="view"></div>
  </main>
</div>
<dialog id="clipdlg"></dialog>
<dialog id="formdlg"></dialog>
<input type="file" id="file" accept="video/*" multiple hidden>
<div id="toasts" role="status" aria-live="polite"></div>
<div class="pop" id="bellpop" role="dialog" aria-label="Notifications" hidden></div>

<script src="/assets/gradient-ascii.js"></script>
<script type="module" src="/assets/main.js"></script>
</body>
</html>
